<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みんなにっこり😊にじいろ屋<注文票></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>注文票</h1>

        <table>
            <thead>
                <tr>
                    <th class="delete-header" style="display: none; width: 40px;">選択</th>
                    <th>商品名</th>
                    <th>値段</th>
                    <th>個数</th>
                    <th>金額</th>
                </tr>
            </thead>
            <tbody id="product-list-body"></tbody>
        </table>

        

        <div class="control-penel">
            <button id="reset-btn" class="btn reset-btn">リセット</button>
            <button id="toggle-edit-btn" class="btn edit-btn">変更</button>
            <button id="toggle-add-btn" class="btn add-btn">追加</button>
            <button id="delete-mode-btn" class="btn delete-btn">削除</button>
        </div>


        <div class="total-area">
            <span>合計金額:</span>
            <span id="total-price">0</span> 円
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
